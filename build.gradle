plugins {
    id 'java'
}

group = 'com.starlightuniverse'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.112-stable'
    compileOnly 'com.zaxxer:HikariCP:5.1.0'
    compileOnly 'com.mysql:mysql-connector-j:8.4.0'
    compileOnly 'org.mindrot:jbcrypt:0.4'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('packageResourcePack', Zip) {
    archiveFileName = 'starlight-pack.zip'
    destinationDirectory = layout.buildDirectory.dir('pack')
    from(file("$projectDir/resourcepack")) {
        exclude '**/.gitkeep'
    }
}

processResources {
    dependsOn 'packageResourcePack'
    from(layout.buildDirectory.file('pack/starlight-pack.zip'))
}

jar {
    archiveBaseName = 'StarlightUniverse'
}
