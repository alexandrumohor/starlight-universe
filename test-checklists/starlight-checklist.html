<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlight Universe — Test Checklist</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            background: linear-gradient(90deg, #FFD700, #FF8C00, #FF4500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 2rem;
        }
        .progress-bar {
            background: #1a1a2e;
            border-radius: 8px;
            height: 24px;
            margin-bottom: 2rem;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            background: linear-gradient(90deg, #55FF55, #00CC00);
            height: 100%;
            transition: width 0.3s;
            border-radius: 8px;
        }
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 4px rgba(0,0,0,0.8);
        }
        h2 {
            color: #FFD700;
            border-bottom: 2px solid #333;
            padding-bottom: 0.5rem;
            margin: 1.5rem 0 1rem 0;
            font-size: 1.2rem;
        }
        .task {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            margin-bottom: 0.25rem;
            transition: background 0.15s;
        }
        .task:hover { background: #1a1a2e; }
        .task input[type="checkbox"] {
            margin-top: 3px;
            width: 18px;
            height: 18px;
            accent-color: #55FF55;
            cursor: pointer;
            flex-shrink: 0;
        }
        .task label {
            cursor: pointer;
            line-height: 1.5;
        }
        .task input:checked + label {
            text-decoration: line-through;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Starlight Universe</h1>
    <p class="subtitle">Test Checklist — check each step as you verify it</p>
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-text" id="progressText"></div>
    </div>

    <!-- PHASE 0 -->
    <h2>Phase 0 — Skeleton + Repository</h2>
    <div class="task"><input type="checkbox" id="p0_1"><label for="p0_1">Start the server — console shows "[SU] Enabled!"</label></div>
    <div class="task"><input type="checkbox" id="p0_2"><label for="p0_2">Stop the server — console shows "[SU] Disabled!"</label></div>
    <div class="task"><input type="checkbox" id="p0_3"><label for="p0_3">Check that the resourcepack/ folder exists with the correct subfolders</label></div>

    <!-- PHASE 1 -->
    <h2>Phase 1 — Database</h2>
    <div class="task"><input type="checkbox" id="p1_1"><label for="p1_1">Start the server with correct database.yml — console shows "Database connected successfully!"</label></div>
    <div class="task"><input type="checkbox" id="p1_2"><label for="p1_2">Check MySQL: tables su_players, su_bans, su_mutes, su_warns exist</label></div>
    <div class="task"><input type="checkbox" id="p1_3"><label for="p1_3">Start with wrong DB credentials — plugin disables with a clear error</label></div>

    <!-- PHASE 2 -->
    <h2>Phase 2 — Login / Register</h2>
    <div class="task"><input type="checkbox" id="p2_1"><label for="p2_1">Join the server — you are blocked (can't move, can't chat, can't interact)</label></div>
    <div class="task"><input type="checkbox" id="p2_2"><label for="p2_2">First time: see message to /register. Type /register pass pass — you're logged in</label></div>
    <div class="task"><input type="checkbox" id="p2_3"><label for="p2_3">Reconnect — see message to /login. Type /login pass — you're logged in</label></div>
    <div class="task"><input type="checkbox" id="p2_4"><label for="p2_4">Type /login wrongpass — get error. Do it 5 times — get cooldown message</label></div>
    <div class="task"><input type="checkbox" id="p2_5"><label for="p2_5">Reconnect within 5 minutes — session restores automatically, no login needed</label></div>
    <div class="task"><input type="checkbox" id="p2_6"><label for="p2_6">/changepass old new — password changes successfully</label></div>
    <div class="task"><input type="checkbox" id="p2_7"><label for="p2_7">Try /register with password under 3 characters — get error</label></div>
    <div class="task"><input type="checkbox" id="p2_8"><label for="p2_8">Try /register with mismatched passwords — get error</label></div>

    <!-- PHASE 3 -->
    <h2>Phase 3 — World Wiring + Lobby + Queue</h2>
    <div class="task"><input type="checkbox" id="p3_1"><label for="p3_1">Start the server — console shows "world_dragon" being created (other worlds already exist)</label></div>
    <div class="task"><input type="checkbox" id="p3_2"><label for="p3_2">Check MySQL: tables su_inventories and su_server_data exist</label></div>
    <div class="task"><input type="checkbox" id="p3_3"><label for="p3_3">Join the server — you spawn in the lobby world (permanent night, no mobs)</label></div>
    <div class="task"><input type="checkbox" id="p3_4"><label for="p3_4">In lobby: your gamemode is ADVENTURE, it's always night, no rain, no mobs</label></div>
    <div class="task"><input type="checkbox" id="p3_5"><label for="p3_5">Log in or register — you get a Nether Star named "★ Survival Teleport" in the middle slot</label></div>
    <div class="task"><input type="checkbox" id="p3_6"><label for="p3_6">Try dropping the Nether Star — it doesn't drop</label></div>
    <div class="task"><input type="checkbox" id="p3_7"><label for="p3_7">Right-click the Nether Star — you see a "joining queue" message</label></div>
    <div class="task"><input type="checkbox" id="p3_8"><label for="p3_8">Wait in queue — action bar shows "Pozitia ta: 1 / 1" then you get teleported to survivallobby</label></div>
    <div class="task"><input type="checkbox" id="p3_9"><label for="p3_9">In survivallobby: your gamemode is ADVENTURE (safe zone)</label></div>
    <div class="task"><input type="checkbox" id="p3_10"><label for="p3_10">Travel to the overworld — gamemode switches to SURVIVAL, PvP is on</label></div>
    <div class="task"><input type="checkbox" id="p3_11"><label for="p3_11">Grab some items in survival, then disconnect</label></div>
    <div class="task"><input type="checkbox" id="p3_12"><label for="p3_12">Reconnect — you're back in lobby with ONLY the Nether Star (no survival items)</label></div>
    <div class="task"><input type="checkbox" id="p3_13"><label for="p3_13">Right-click Nether Star again, queue, enter survival — your items from before are restored</label></div>
    <div class="task"><input type="checkbox" id="p3_14"><label for="p3_14">Travel to Nether or End — your inventory stays the same (shared across survival worlds)</label></div>
    <div class="task"><input type="checkbox" id="p3_15"><label for="p3_15">Click the Nether Star while already in queue — get "already in queue" message</label></div>
    <div class="task"><input type="checkbox" id="p3_16"><label for="p3_16">world_dragon exists as an End world — you can enter and fight the dragon</label></div>
    <div class="task"><input type="checkbox" id="p3_17"><label for="p3_17">In world_dragon: try using an End Gateway portal — it's blocked</label></div>
    <div class="task"><input type="checkbox" id="p3_18"><label for="p3_18">Dragon respawn: at 00:00, 06:00, 12:00 or 18:00 (RO time) players in dragon world get teleported out, entry is blocked</label></div>
    <div class="task"><input type="checkbox" id="p3_19"><label for="p3_19">After reset: chat shows "The Dragon has been respawned!" — entry reopens 15 seconds later</label></div>

    <!-- PHASE 4 -->
    <h2>Phase 4 — Economy + Currencies</h2>
    <div class="task"><input type="checkbox" id="p4_1"><label for="p4_1">Log in and type /bal — you see your balance: $0, ◆0, ★0 with colored icons</label></div>
    <div class="task"><input type="checkbox" id="p4_2"><label for="p4_2">As OP, type /givemoney YourName 5000 — you get a message saying you received $5,000</label></div>
    <div class="task"><input type="checkbox" id="p4_3"><label for="p4_3">Type /bal — Money now shows $5,000</label></div>
    <div class="task"><input type="checkbox" id="p4_4"><label for="p4_4">/givegems YourName 200 — Gems shows ◆200 in /bal</label></div>
    <div class="task"><input type="checkbox" id="p4_5"><label for="p4_5">/givestars YourName 50 — Stars shows ★50 in /bal</label></div>
    <div class="task"><input type="checkbox" id="p4_6"><label for="p4_6">With a second player online, type /pay Player2 money 1000 — you lose $1,000 and they get $980 (2% tax)</label></div>
    <div class="task"><input type="checkbox" id="p4_7"><label for="p4_7">Both you and Player2 see confirmation messages with the amounts</label></div>
    <div class="task"><input type="checkbox" id="p4_8"><label for="p4_8">Try /pay Player2 gems 100 — get error "Gems and Stars are non-tradeable!"</label></div>
    <div class="task"><input type="checkbox" id="p4_9"><label for="p4_9">Try /pay Player2 stars 10 — same error about non-tradeable</label></div>
    <div class="task"><input type="checkbox" id="p4_10"><label for="p4_10">Try /pay YourName money 100 — get error "You cannot pay yourself!"</label></div>
    <div class="task"><input type="checkbox" id="p4_11"><label for="p4_11">Try /pay Player2 money 999999 (more than you have) — get "Insufficient funds!" error</label></div>
    <div class="task"><input type="checkbox" id="p4_12"><label for="p4_12">Numbers format with commas: $1,500 not $1500</label></div>
    <div class="task"><input type="checkbox" id="p4_13"><label for="p4_13">Disconnect and reconnect — /bal shows the same amounts (saved in database)</label></div>
    <div class="task"><input type="checkbox" id="p4_14"><label for="p4_14">/givemoney OfflinePlayer 1000 while they're offline — says "(offline)" in confirmation</label></div>
    <div class="task"><input type="checkbox" id="p4_15"><label for="p4_15">Non-OP player tries /givemoney — gets "No permission!" error</label></div>
    <div class="task"><input type="checkbox" id="p4_16"><label for="p4_16">Tab-complete works: /pay shows player names, then money/gems/stars</label></div>

    <!-- PHASE 5 -->
    <h2>Phase 5 — Server Shop</h2>
    <div class="task"><input type="checkbox" id="p5_1"><label for="p5_1">Type /shop — a GUI opens with "Shop" title in gold</label></div>
    <div class="task"><input type="checkbox" id="p5_2"><label for="p5_2">Main menu shows 3 Daily Deals at the top with discount tags and sale prices</label></div>
    <div class="task"><input type="checkbox" id="p5_3"><label for="p5_3">Main menu shows 13 categories: Building, Decoration, Redstone, Transport, Food, Tools, Weapons, Armor, Brewing, Materials, Dyes, Spawn Eggs, Misc</label></div>
    <div class="task"><input type="checkbox" id="p5_4"><label for="p5_4">Click on "Building" category — opens a page with building blocks (Dirt $1, Cobblestone $2, Stone $5, etc.)</label></div>
    <div class="task"><input type="checkbox" id="p5_5"><label for="p5_5">Each item shows its price in green and category in gray in the lore</label></div>
    <div class="task"><input type="checkbox" id="p5_6"><label for="p5_6">Click on an item (e.g. Dirt) — buy screen opens with quantity buttons</label></div>
    <div class="task"><input type="checkbox" id="p5_7"><label for="p5_7">Buy screen has 3 green panes (+1, +10, +64) and 3 red panes (-1, -10, -64)</label></div>
    <div class="task"><input type="checkbox" id="p5_8"><label for="p5_8">Click +10 a few times — quantity increases by 10 each click, info panel updates</label></div>
    <div class="task"><input type="checkbox" id="p5_9"><label for="p5_9">Click -1 — quantity goes down by 1 (minimum 1, never goes to 0)</label></div>
    <div class="task"><input type="checkbox" id="p5_10"><label for="p5_10">Info panel (paper item) shows unit price, quantity, and total cost</label></div>
    <div class="task"><input type="checkbox" id="p5_11"><label for="p5_11">Give yourself money (/givemoney YourName 100000), then click Confirm — you receive the items and money is deducted</label></div>
    <div class="task"><input type="checkbox" id="p5_12"><label for="p5_12">Success message shows what you bought and the total cost with commas</label></div>
    <div class="task"><input type="checkbox" id="p5_13"><label for="p5_13">Try to buy something you can't afford — get "Insufficient funds!" error</label></div>
    <div class="task"><input type="checkbox" id="p5_14"><label for="p5_14">Click Cancel on buy screen — returns to the category page you came from</label></div>
    <div class="task"><input type="checkbox" id="p5_15"><label for="p5_15">Click "Back" on a category page — returns to main shop menu</label></div>
    <div class="task"><input type="checkbox" id="p5_16"><label for="p5_16">Type /shop search diamond — shows all items with "diamond" in the name</label></div>
    <div class="task"><input type="checkbox" id="p5_17"><label for="p5_17">/shop search with a word that matches nothing — get "No items found" error message</label></div>
    <div class="task"><input type="checkbox" id="p5_18"><label for="p5_18">Click a Daily Deal on the main page — buy screen shows the discounted price with "Daily Deal" info</label></div>
    <div class="task"><input type="checkbox" id="p5_19"><label for="p5_19">Buy a Daily Deal item — you pay the discounted price, not the full price</label></div>
    <div class="task"><input type="checkbox" id="p5_20"><label for="p5_20">Select 320+ items (5+ stacks) — info panel shows "Bulk Discount (10%)" line</label></div>
    <div class="task"><input type="checkbox" id="p5_21"><label for="p5_21">Buy 320+ of a cheap item — verify the final price is 10% less than the subtotal</label></div>
    <div class="task"><input type="checkbox" id="p5_22"><label for="p5_22">Buy with a full inventory — extra items drop on the ground near you</label></div>
    <div class="task"><input type="checkbox" id="p5_23"><label for="p5_23">Tab-complete /shop shows "search" as a suggestion</label></div>
    <div class="task"><input type="checkbox" id="p5_24"><label for="p5_24">There is NO sell option anywhere in the shop — buy only</label></div>
    <div class="task"><input type="checkbox" id="p5_25"><label for="p5_25">Daily deals change to different items the next day (same items all day)</label></div>

    <script>
        function updateProgress() {
            var boxes = document.querySelectorAll('input[type="checkbox"]');
            var checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
            var pct = Math.round((checked / boxes.length) * 100);
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressText').textContent = checked + ' / ' + boxes.length + ' (' + pct + '%)';
            var data = {};
            boxes.forEach(function(cb) { data[cb.id] = cb.checked; });
            try { localStorage.setItem('su_checklist', JSON.stringify(data)); } catch(e) {}
        }
        (function() {
            try {
                var saved = JSON.parse(localStorage.getItem('su_checklist') || '{}');
                Object.keys(saved).forEach(function(id) {
                    var el = document.getElementById(id);
                    if (el) el.checked = saved[id];
                });
            } catch(e) {}
            updateProgress();
            document.querySelectorAll('input[type="checkbox"]').forEach(function(cb) {
                cb.addEventListener('change', updateProgress);
            });
        })();
    </script>
</body>
</html>
